<!DOCTYPE html>
<html>
    <head>
        <title>Audio Visualizer</title>
        <link rel="icon" href="icon/icon64.png" sizes="16x16">
        <link rel="icon" href="icon/icon128.png" sizes="48x48">
        <link rel="icon" href="icon/icon256.png" sizes="128x128">
        <style>
            /* Black backdrop on the root only. Scenes append a position:fixed,
               z-index:-1 canvas filling the viewport; a block-level <body>
               background would paint OVER that negative-z canvas and hide the
               scene, so keep <body> transparent and put the backdrop on <html>. */
            html {
                background: #000;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            canvas {
                display: block;
            }
        </style>
    </head>

    <body>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
