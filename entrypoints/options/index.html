<!DOCTYPE html>
<html>

<head>
        <meta name="manifest.open-in-tab" content="true">
        <title>Audio Visualizer - Debug Settings</title>
        <link rel="icon" href="icon/icon64.png" sizes="16x16">
        <link rel="icon" href="icon/icon128.png" sizes="48x48">
        <link rel="icon" href="icon/icon256.png" sizes="128x128">
        <style>
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; max-width: 900px; margin: 0 auto; }
                h1 { font-size: 1.4em; margin-bottom: 4px; color: #fff; }
                .subtitle { color: #888; font-size: 0.85em; margin-bottom: 24px; }
                .toolbar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
                button { background: #2a2a4a; color: #e0e0e0; border: 1px solid #444; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
                button:hover { background: #3a3a5a; }
                button.danger { border-color: #a33; color: #f88; }
                button.danger:hover { background: #522; }
                button.save { border-color: #3a3; color: #8f8; }
                .entry { background: #16213e; border: 1px solid #333; border-radius: 6px; padding: 14px; margin-bottom: 12px; }
                .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
                .entry-key { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.9em; color: #7ec8e3; word-break: break-all; }
                textarea { width: 100%; background: #0f0f23; color: #ccc; border: 1px solid #444; border-radius: 4px; padding: 8px; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.82em; resize: vertical; min-height: 40px; }
                textarea.invalid { border-color: #a33; }
                .warning { color: #f88; font-size: 0.78em; margin-top: 4px; }
                .entry-actions { display: flex; gap: 6px; margin-top: 8px; }
                .add-form { background: #16213e; border: 1px solid #333; border-radius: 6px; padding: 14px; margin-bottom: 12px; }
                .add-form input { background: #0f0f23; color: #ccc; border: 1px solid #444; border-radius: 4px; padding: 6px 8px; font-family: monospace; font-size: 0.85em; width: 100%; margin-bottom: 8px; }
                .empty { color: #666; text-align: center; padding: 40px; }
        </style>
</head>

<body>
        <h1>Debug / Recovery Settings</h1>
        <p class="subtitle">Raw localStorage entries for the Audio Visualizer extension. Use this to inspect, edit, or reset settings when the extension is in a bad state.</p>
        <div id="app"></div>
        <script type="module" src="./main.ts"></script>
</body>

</html>
