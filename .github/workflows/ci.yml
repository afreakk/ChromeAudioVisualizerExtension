name: CI
on:
  push:
    branches: [master, wxt-and-manifest-v3]
  pull_request:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm run lint
      - name: Scene registration consistency
        run: pnpm run check:scenes
      - name: Type check
        run: pnpm run compile
